<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="620" fill="#ffffff"/>
  <!-- macOS -->
  <rect x="20" y="16" width="920" height="54" rx="4" fill="#eef0f2" stroke="#b8bec5"/>
  <text x="34" y="37" font-size="11" fill="#555" font-weight="bold">macOS 26 (Apple silicon)</text>
  <text x="34" y="57" font-size="12" fill="#333">Camera · Vision · SpeechAnalyzer · CGEventSource idle · NSWorkspace · LocalAuthentication · FoundationModels · AVSpeechSynthesizer · Trash</text>

  <!-- sensing -->
  <rect x="20" y="96" width="300" height="150" rx="4" fill="#fff" stroke="#2f6f8f" stroke-width="1.5"/>
  <text x="34" y="118" font-size="12" font-weight="bold" fill="#2f6f8f">LanternSense.app (Swift)</text>
  <text x="34" y="138" font-size="11" fill="#333">camera loop 4 fps · face rect + 76 landmarks</text>
  <text x="34" y="154" font-size="11" fill="#333">geometry + FeaturePrint descriptors</text>
  <text x="34" y="170" font-size="11" fill="#333">body/hand pose 1 Hz · scene 0.1 Hz</text>
  <text x="34" y="186" font-size="11" fill="#333">frontmost app · HID idle seconds</text>
  <text x="34" y="202" font-size="11" fill="#333">push-to-talk + hands-free wake (off)</text>
  <text x="34" y="218" font-size="11" fill="#333">enrollment.json · identity_probes.json</text>
  <text x="34" y="236" font-size="10" fill="#8a4b00">no sandbox · ad-hoc signed</text>

  <!-- core -->
  <rect x="360" y="96" width="400" height="330" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="374" y="118" font-size="12" font-weight="bold" fill="#222">lantern (Tauri 2 shell, Rust) + lantern-core</text>
  <g font-size="11" fill="#222">
    <rect x="374" y="130" width="176" height="40" fill="#f5f5f5" stroke="#ccc"/><text x="382" y="148">engine: identity frames,</text><text x="382" y="162">evidence, context, events</text>
    <rect x="564" y="130" width="182" height="40" fill="#f5f5f5" stroke="#ccc"/><text x="572" y="148">authz: session, levels 0–4,</text><text x="572" y="162">Touch ID grants</text>
    <rect x="374" y="180" width="176" height="40" fill="#f5f5f5" stroke="#ccc"/><text x="382" y="198">safety screen → intent</text><text x="382" y="212">router (word rules)</text>
    <rect x="564" y="180" width="182" height="40" fill="#f5f5f5" stroke="#ccc"/><text x="572" y="198">goals: 5 fixed plan</text><text x="572" y="212">templates · calculator</text>
    <rect x="374" y="230" width="176" height="40" fill="#f5f5f5" stroke="#ccc"/><text x="382" y="248">transaction → broker</text><text x="382" y="262">gate → read-back verify</text>
    <rect x="564" y="230" width="182" height="40" fill="#f5f5f5" stroke="#ccc"/><text x="572" y="248">privacy firewall</text><text x="572" y="262">(sealed Cleared&lt;T&gt;)</text>
    <rect x="374" y="280" width="176" height="40" fill="#f5f5f5" stroke="#ccc"/><text x="382" y="298">model boundary: admit,</text><text x="382" y="312">sanitize, validate output</text>
    <rect x="564" y="280" width="182" height="40" fill="#f5f5f5" stroke="#ccc"/><text x="572" y="298">storage analysis,</text><text x="572" y="312">folders, apps</text>
    <rect x="374" y="330" width="176" height="40" fill="#f5f5f5" stroke="#ccc"/><text x="382" y="348">kill latch · pause</text><text x="382" y="362">capability registry</text>
    <rect x="564" y="330" width="182" height="40" fill="#f5f5f5" stroke="#ccc"/><text x="572" y="348">speech gate / narration</text><text x="572" y="362">surface projection</text>
  </g>
  <text x="374" y="400" font-size="11" fill="#333">SQLite (events, snapshots, ledger) + KILLED latch file — ~/Library/Application Support/Lantern</text>
  <text x="374" y="416" font-size="10" fill="#8a4b00">46 IPC commands · mutexes with .lock().unwrap()</text>

  <!-- UI -->
  <rect x="800" y="96" width="140" height="150" rx="4" fill="#fff" stroke="#6b4fa0" stroke-width="1.5"/>
  <text x="812" y="118" font-size="12" font-weight="bold" fill="#6b4fa0">React window</text>
  <text x="812" y="138" font-size="11" fill="#333">renders Surface</text>
  <text x="812" y="154" font-size="11" fill="#333">sends gestures</text>
  <text x="812" y="170" font-size="11" fill="#333">no authority</text>
  <text x="812" y="186" font-size="11" fill="#333">CSP script-src 'self'</text>
  <text x="812" y="202" font-size="11" fill="#333">routes text:</text>
  <text x="812" y="218" font-size="11" fill="#333">reference → command</text>
  <text x="812" y="234" font-size="11" fill="#333">→ ask</text>

  <!-- helpers -->
  <g font-size="11">
    <rect x="20" y="470" width="170" height="60" rx="4" fill="#fff" stroke="#2f6f8f"/><text x="32" y="492" font-weight="bold" fill="#2f6f8f">KueAct.app</text><text x="32" y="510" fill="#333">open/quit/url/file/folder</text><text x="32" y="524" fill="#333">trash/untrash/notify</text>
    <rect x="210" y="470" width="150" height="60" rx="4" fill="#fff" stroke="#2f6f8f"/><text x="222" y="492" font-weight="bold" fill="#2f6f8f">kue-auth</text><text x="222" y="510" fill="#333">Touch ID / password</text><text x="222" y="524" fill="#333">stdout "SUCCESS"</text>
    <rect x="380" y="470" width="170" height="60" rx="4" fill="#fff" stroke="#2f6f8f"/><text x="392" y="492" font-weight="bold" fill="#2f6f8f">lantern-mind</text><text x="392" y="510" fill="#333">FoundationModels</text><text x="392" y="524" fill="#333">on-device, no tools</text>
    <rect x="570" y="470" width="150" height="60" rx="4" fill="#fff" stroke="#2f6f8f"/><text x="582" y="492" font-weight="bold" fill="#2f6f8f">kue-voice</text><text x="582" y="510" fill="#333">AVSpeechSynthesizer</text><text x="582" y="524" fill="#333">speech out only</text>
    <rect x="740" y="470" width="200" height="60" rx="4" fill="#fafafa" stroke="#aaa" stroke-dasharray="4 3"/><text x="752" y="492" font-weight="bold" fill="#888">Not present</text><text x="752" y="510" fill="#888">network · cloud model · AX</text><text x="752" y="524" fill="#888">calendar · recall · proactive</text>
  </g>

  <!-- arrows -->
  <line x1="170" y1="70" x2="170" y2="94" stroke="#555" marker-end="url(#a)"/>
  <line x1="320" y1="170" x2="358" y2="170" stroke="#555" marker-end="url(#a)"/>
  <text x="322" y="162" font-size="9" fill="#555">NDJSON</text>
  <line x1="760" y1="160" x2="798" y2="160" stroke="#555" marker-end="url(#a)"/>
  <line x1="798" y1="200" x2="762" y2="200" stroke="#555" marker-end="url(#a)"/>
  <line x1="105" y1="468" x2="440" y2="428" stroke="#555" marker-start="url(#a)"/>
  <line x1="285" y1="468" x2="470" y2="428" stroke="#555" marker-start="url(#a)"/>
  <line x1="465" y1="468" x2="500" y2="428" stroke="#555" marker-start="url(#a)"/>
  <line x1="645" y1="468" x2="620" y2="428" stroke="#555" marker-start="url(#a)"/>
  <text x="20" y="580" font-size="11" fill="#333">Every helper is a separate process started by the shell, found by path search, spoken to over stdin/stdout JSON.</text>
  <text x="20" y="598" font-size="11" fill="#333">Pixels and audio never leave LanternSense; the core receives derived numbers only (verified by reading Protocol.swift / sensor.rs).</text>
</svg>
